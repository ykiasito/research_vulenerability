name: closed-mode drift check (branch-triggered)

# 目的: master -> closed-mode の一方向mergeが遅延していないかを可視化する。
# このワークフローは「取りこぼしの検知・可視化」のみを行う。
# 自動マージ・自動衝突解決は一切行わない(closed-modeロールアウト計画で
# 自動マージ戦略の常用は禁止されているため)。ドリフトが検知された場合の
# 対応(closed-modeブランチへのmerge)は引き続き人手で行うこと。
#
# 注記(§3-2の例外): closed-modeブランチは本来「削除のみ・足さない」が原則だが、
# このワークフロー自体はその不変条件を可視化するためのCI成果物であり、
# §3-6が閉域ブランチ専用の検証手段を要求しているため、明示的な例外として追加する。
#
# セキュリティSLA(運用規律、このワークフローでは自動判定しない):
# masterに入ったセキュリティ関連修正(依存パッケージのCVE pin、認証/認可、
# SSRF対策、シークレット関連の修正など)は、検知を待たず48時間以内に
# closed-modeへmergeすること。「セキュリティ関連かどうか」の分類は
# 自動化が難しい人手判断のため、このワークフローの対象外としている。
#
# 判定ロジック: master側にあってclosed-mode側に無いコミットのうち、
# 最も古い(=最初に取り込み漏れになった)コミットの日時を基準に、
# 現在時刻からの経過日数を計算する。コミット「数」ではなく経過「日数」で
# 判定する(同期作業中に一時的にコミット数が増えること自体は異常ではないため)。
# 経過日数が7日未満の場合は、まだ同期作業中である可能性があるため
# 失敗させない。7日以上経過している場合のみワークフローを失敗させる。
# (このロジック自体は `master` 側の同名ワークフローと同一。)
#
# `master`側の同名ワークフロー(`closed-mode-drift-check.yml`)との関係
# (重要): GitHub Actionsはワークフローを「ブランチ」ではなく「リポジトリ内の
# ファイルパス」単位で識別する。そのため`master`側にも`closed-mode`側にも
# `.github/workflows/closed-mode-drift-check.yml`という同一パスのファイルが
# 存在すると、ブランチが違っても両者は同一`workflow_id`に解決され、
# 有効/無効の状態まで共有する単一のワークフローエンティティになってしまう
# (「別ブランチ上のファイルだから実行は独立している」という前提は誤り、
# 2026-09-02のsenior-reviewer指摘で判明)。このファイルを
# `closed-mode-drift-check-branch.yml`という別名にしているのは、UI上の
# 見分けやすさのためではなく、パス衝突そのものを回避して別エンティティに
# するための必須の対処。
#
# 次回、master -> closed-mode の同期マージで`master`側の
# `closed-mode-drift-check.yml`(`schedule`トリガー、毎日`ref: closed-mode`を
# 明示checkoutして同じ判定を行う)がclosed-modeへ到着したときの対処:
# `schedule`トリガーはデフォルトブランチ上のワークフロー定義でのみ発火する
# (GitHub Actionsの既知の仕様)ため、closed-modeブランチに置いても
# `schedule`は発火せず死んだ設定になる。したがって同期マージ時に
# `closed-mode-drift-check.yml`は削除してよい(§3-2の「masterからの差分は
# 削除のみ」不変条件の範囲内の操作)。このファイル
# (`closed-mode-drift-check-branch.yml`)は残すこと。`master`側のファイルで
# このファイルを上書き・置き換える形で「解決」しないこと(push/pull_request
# トリガーの経路が失われる)。
#
# `closed-mode-architecture-gate.yml`と同じパターンで、`schedule`を持たず
# 代わりにclosed-modeへのpush/pull_requestをトリガーにする。これにより
# 「push/PRのたびに即座に確認する」経路と「毎日必ず一度確認する」経路の
# 二経路になり、互いの穴を補完する(closed-mode backlog item 206)。

on:
  pull_request:
    branches:
      - closed-mode
  push:
    branches:
      - closed-mode
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check-branch-triggered:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/master history
        run: git fetch origin master:refs/remotes/origin/master

      - name: Evaluate drift (commit count + oldest un-merged commit age)
        shell: bash
        run: |
          set -euo pipefail

          behind_count=$(git rev-list --count HEAD..origin/master)
          echo "closed-mode is behind origin/master by ${behind_count} commit(s)"

          if [ "${behind_count}" -eq 0 ]; then
            echo "No drift. closed-mode is up to date with origin/master."
            exit 0
          fi

          # HEAD(closed-mode側の今回のイベント対象)..origin/master は
          # origin/master 側にあって closed-mode 側に無いコミット一覧
          # (新しい順)。末尾が最も古い、つまり最初に取り込み漏れになった
          # コミット。
          oldest_unmerged_sha=$(git rev-list HEAD..origin/master | tail -n 1)
          oldest_commit_date=$(git log -1 --format=%cI "${oldest_unmerged_sha}")

          now_epoch=$(date -u +%s)
          commit_epoch=$(date -u -d "${oldest_commit_date}" +%s)
          days_elapsed=$(( (now_epoch - commit_epoch) / 86400 ))

          echo "Oldest un-merged commit: ${oldest_unmerged_sha} (${oldest_commit_date})"
          echo "Days elapsed since oldest un-merged commit: ${days_elapsed}"

          if [ "${days_elapsed}" -ge 7 ]; then
            echo "::error::closed-mode has been drifting for ${days_elapsed} day(s) since commit ${oldest_unmerged_sha} (>= 7-day threshold). Please merge master into closed-mode."
            exit 1
          fi

          echo "Drift exists (${behind_count} commit(s) behind) but within the 7-day grace period (${days_elapsed} day(s) elapsed). Not failing yet."
