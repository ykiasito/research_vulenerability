services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulncheck}
      POSTGRES_USER: ${POSTGRES_USER:-vulncheck}
      # No default: a committed dev-only password default is exactly the class of problem this
      # rotation is fixing for the encryption key too. MUST be set via .env (never committed).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulncheck} -d ${POSTGRES_DB:-vulncheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulncheck}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vulncheck}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # No default on purpose (unlike the vars below): SecretEncryptionService fail-fasts at
      # startup if this is blank or matches a retired default's hash. Set via .env, generate with
      # `openssl rand -base64 32`.
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
      # One-shot: mirrors the full NVD CPE Dictionary on boot (hours). Leave false; flip to true
      # once per environment, then set it back. See CpeDictionaryBootstrapSync.
      CPE_FULL_SYNC_ON_STARTUP: ${CPE_FULL_SYNC_ON_STARTUP:-false}
      # Weekly automatic full re-sync of the same mirror (Sunday 01:30 UTC by default, ~103 min).
      # Off by default; enabling it is an operational decision (see
      # docs/spec/cpe-dictionary-mirror-plan.md).
      CPE_SCHEDULED_RESYNC_ENABLED: ${CPE_SCHEDULED_RESYNC_ENABLED:-false}
      # Overrides the cron above's default schedule. A scheduled-uptime deployment must set this to
      # a time strictly after the instance's own start time, or the trigger silently never fires
      # (see CpeDictionaryScheduledResync#resyncWeekly's javadoc).
      CPE_SCHEDULED_RESYNC_CRON: ${CPE_SCHEDULED_RESYNC_CRON:-0 30 1 * * SUN}
      # Per-job AI-spend cap, see JobCostBudgetService#costCapPerItemUsd. Leave at the $5/1,000-item
      # default; only raise for a throwaway diagnostic job made entirely of AI-eligible items (a
      # real job's items are mostly free static Tier1 matches, so the default holds there).
      APP_COST_CAP_PER_ITEM_USD: ${APP_COST_CAP_PER_ITEM_USD:-0.005}
      # These two move together (item 167, 2026-09-01, docs/spec/closed-mode-plan.md §7 P4).
      # Per-item parallelism within a single job — see AsyncConfig#itemProcessingExecutor's javadoc
      # for why 8 was chosen; only raise it after measuring HikariCP connection-acquire p95 under
      # load, and keep SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE comfortably above it.
      ITEM_PROCESSING_POOL_SIZE: ${ITEM_PROCESSING_POOL_SIZE:-8}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}
      # Thymeleaf template cache (see application.yml). Enabled by default; set to false in .env
      # only for a deliberate template-focused debugging session (templates are baked into the
      # image and never edited live in the running container otherwise).
      THYMELEAF_CACHE_ENABLED: ${THYMELEAF_CACHE_ENABLED:-true}
      # Secure attribute on the session cookie (see application.yml). False by default because this
      # compose setup has no TLS termination — set to true in .env only once this deployment sits
      # behind TLS (e.g. the EC2/production rollout), otherwise logins will silently stop working.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./logs/backend:/var/log/app
    # Gives the researchJobExecutor's setAwaitTerminationSeconds(20) room to actually run before
    # Docker SIGKILLs the process — default stop_grace_period (10s) is shorter than that window.
    stop_grace_period: 30s

volumes:
  postgres_data:
