<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <title>新規登録 - 脆弱性調査サーバー</title>
</head>
<body>
<h1>新規登録</h1>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/register}" th:object="${registerForm}" method="post">
    <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" th:field="*{email}" required="required"/>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
    </div>
    <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" th:field="*{password}" required="required"/>
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span>
    </div>
    <button type="submit">登録</button>
</form>

<p><a th:href="@{/login}">ログインはこちら</a></p>
</body>
</html>
