<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <title>CSVアップロード - 脆弱性調査サーバー</title>
</head>
<body>
<h1>CSVアップロード</h1>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<p>
    必須列: <code>product_name, version, usage_text</code><br/>
    任意列: <code>vendor, install_url</code><br/>
    <a th:href="@{/jobs/template.csv}">テンプレートCSVをダウンロード</a><br/>
    列名がこの通りでなくても、アップロード後に列の対応を選択できます。
</p>

<form th:action="@{/jobs}" method="post" enctype="multipart/form-data">
    <div>
        <label for="csvFile">CSVファイル</label>
        <input type="file" id="csvFile" name="csvFile" accept=".csv" required="required"/>
    </div>
    <button type="submit" style="margin-top: 0.8em;">アップロードして調査開始</button>
</form>

<p><a th:href="@{/jobs}">ジョブ一覧に戻る</a></p>
</body>
</html>
