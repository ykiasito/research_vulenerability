spring:
  application:
    name: vulncheck-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vulncheck}
    username: ${SPRING_DATASOURCE_USERNAME:vulncheck}
    # No default: a committed dev-only password default is the same class of problem as the
    # encryption key default below. MUST be set via SPRING_DATASOURCE_PASSWORD in every environment.
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Previously unset (Spring Boot/HikariCP's own default, 10), then pinned explicitly at that
      # same value (item 167, 2026-09-01, docs/spec/closed-mode-plan.md §3-3 A4/§7 P2). Raised to 20
      # (item 198, 2026-09-03, §7 P2's recommended initial value): closed-mode's Stage1 trigram
      # search + Stage2's 4 local mirror sources keep an item-processing thread in near-constant DB
      # contention instead of blocked on external network I/O, so at the old maximum-pool-size=10
      # only ~2 connections were left for a concurrently-running sync worker plus the web layer. A
      # live connections.acquire p95 measurement against the real dev DB
      # (HikariPoolAcquireP95Measurement: static 1,000-item job + one concurrent
      # RegistryMirrorSyncService#syncAllAndRelease run) is still pending as of this change — see
      # that class's own javadoc for the intended method; re-run it (by hand, per its own
      # instructions) to confirm 20 is enough headroom before relying on this value, and before
      # raising item-processing-pool-size itself (§7 P4) or adding another always-on sync-style
      # consumer. Keep this comfortably ahead of app.item-processing-pool-size plus any
      # concurrently-running sync workers and the web layer's own connection needs.
      #
      # Registry mirror sync (closed-mode backlog item 186, RegistryMirrorSyncService) runs up to 9
      # ecosystem workers concurrently on AsyncConfig#registryMirrorSyncExecutor, but this is
      # deliberately NOT counted the same way as app.item-processing-pool-size above (senior review,
      # PR #145 REVISE): unlike item processing, a sync worker's per-name work is almost entirely
      # rate-limited HTTP calls to an external registry (ExternalRegistryRateLimiter#awaitTurn),
      # made without holding any DB connection at all — each *MirrorSyncService#syncPackages/
      # #syncModules only borrows a connection once per chunk, for a single batch upsert after the
      # whole chunk's HTTP round trips are already done (see RegistryMirrorSyncService's class
      # javadoc). So the 9 workers' actual DB usage is a handful of short, staggered upsert bursts,
      # not 9 connections held for the sync's full (HTTP-bound) duration.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    # Enabled by default (production-appropriate: templates are baked into the image, never
    # edited live in the running container, so re-parsing on every render is pure overhead). Set
    # THYMELEAF_CACHE_ENABLED=false only for a deliberate template-focused debugging session.
    cache: ${THYMELEAF_CACHE_ENABLED:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  # No default (see SecretEncryptionService): a committed dev-only default here was previously the
  # de facto encryption key in every deployment because docker-compose.yml never wired this env var
  # through. MUST be set via APP_SECRET_ENCRYPTION_KEY — SecretEncryptionService fails fast at
  # startup if it's blank or matches a retired default's hash.
  secret-encryption-key: ${APP_SECRET_ENCRYPTION_KEY:}
  # docker-compose service name by default; override for non-compose environments.
  llm-service-url: ${LLM_SERVICE_URL:http://llm-service:8000}
  # The one account granted ROLE_ADMIN (see AppUserDetailsService) — /admin/** requires it. Empty
  # by default (no admin at all) so a fresh deployment never accidentally leaves admin endpoints
  # open to every authenticated user. Set to the operator's own login email.
  admin-email: ${ADMIN_EMAIL:}
  # Research jobs (and everything under them) older than this are deleted daily at 04:00 UTC.
  # 0 or negative disables the cleanup entirely.
  job-retention-days: ${JOB_RETENTION_DAYS:30}
  # One-shot full NVD CPE Dictionary mirror (~1.8M entries) on startup. Off by default: it runs for
  # hours and only needs to happen once per environment. See CpeDictionaryBootstrapSync.
  cpe-full-sync-on-startup: ${CPE_FULL_SYNC_ON_STARTUP:false}
  # Weekly automatic full re-sync of the same mirror (Sunday 01:30 UTC by default), so it doesn't
  # just go stale forever after the one-shot startup sync. Off by default (safety-first, same
  # rationale as the startup flag above) — see CpeDictionaryScheduledResync and
  # docs/spec/cpe-dictionary-mirror-plan.md.
  cpe-scheduled-resync-enabled: ${CPE_SCHEDULED_RESYNC_ENABLED:false}
  # Cron expression for the weekly resync above. Overridable so a scheduled-uptime deployment (see
  # docs/spec/ec2-deployment-guide.md) can place it strictly after the instance's own start time —
  # Spring never fires a trigger that already elapsed before the process registered it, so a cron
  # left coinciding with (or before) the start time silently never runs. See
  # CpeDictionaryScheduledResync#resyncWeekly's javadoc for the PR #75 REVISE history.
  cpe-scheduled-resync-cron: ${CPE_SCHEDULED_RESYNC_CRON:0 30 1 * * SUN}
  # Closed-mode registry mirror (backlog item 176): when true, CratesIoRegistryClient / RubyGemsRegistryClient /
  # PackagistRegistryClient / HexRegistryClient / NpmRegistryClient / PyPiRegistryClient / NuGetRegistryClient /
  # GoProxyRegistryClient / PubRegistryClient answer their Tier1 lookups from the local
  # registry_package_mirror table (populated by CratesIoMirrorSyncService / RubyGemsMirrorSyncService /
  # PackagistMirrorSyncService / HexMirrorSyncService / NpmMirrorSyncService / PyPiMirrorSyncService /
  # NuGetMirrorSyncService / GoMirrorSyncService / PubMirrorSyncService respectively) instead of a live
  # HTTP call. Off by default, same safety-first convention as the CPE flags above — enabling
  # any of these flags before ever running that ecosystem's mirror sync degrades transparently to the live path
  # (see each registry client's own javadoc), it does not break lookups.
  closed-mode:
    crates-io-mirror-enabled: ${CLOSED_MODE_CRATES_IO_MIRROR_ENABLED:false}
    rubygems-mirror-enabled: ${CLOSED_MODE_RUBYGEMS_MIRROR_ENABLED:false}
    packagist-mirror-enabled: ${CLOSED_MODE_PACKAGIST_MIRROR_ENABLED:false}
    hex-mirror-enabled: ${CLOSED_MODE_HEX_MIRROR_ENABLED:false}
    npm-mirror-enabled: ${CLOSED_MODE_NPM_MIRROR_ENABLED:false}
    pypi-mirror-enabled: ${CLOSED_MODE_PYPI_MIRROR_ENABLED:false}
    nuget-mirror-enabled: ${CLOSED_MODE_NUGET_MIRROR_ENABLED:false}
    go-mirror-enabled: ${CLOSED_MODE_GO_MIRROR_ENABLED:false}
    pub-mirror-enabled: ${CLOSED_MODE_PUB_MIRROR_ENABLED:false}
  # High-confidence AI verification backstop (see HighConfidenceVerificationService) — an extra
  # AI+web_search check for Stage1 items that reached a high-confidence CPE match purely via static
  # (Tier1) logic, never reviewed by Tier2/Tier3's AI disambiguation. Off by default so this never
  # changes existing behavior/cost for a job unless explicitly turned on. Note (REVISE item 7,
  # senior review 2026-08-29, PR #1): this check runs synchronously on the item-processing thread
  # (itemProcessingExecutor, max 8 parallel) like every other AI tier — enabling it can plausibly add
  # on the order of 7-8 minutes of wall-clock throughput to a 1,000-item job.
  high-confidence-verification:
    enabled: ${HIGH_CONFIDENCE_VERIFICATION_ENABLED:false}
    # Only a static match at or above this confidence is eligible.
    confidence-threshold: ${HIGH_CONFIDENCE_VERIFICATION_THRESHOLD:0.95}
    # Multiplier applied to confidence when the AI verdict is "incorrect". An INCORRECT verdict with
    # no surviving registry-based fallback signal is always demoted fully to UNIDENTIFIED regardless
    # of this factor (REVISE item 4, senior review 2026-08-29, PR #1 — see
    # HighConfidenceVerificationService#applyIncorrectVerdict's javadoc for why a configurable
    # demotion floor was removed).
    downgrade-factor: ${HIGH_CONFIDENCE_VERIFICATION_DOWNGRADE_FACTOR:0.5}
    # Per-job AI-spend cap per item for this feature's OWN ledger (see
    # JobCostBudgetService#verificationCostCapPerItemUsd) — deliberately separate from, and not
    # counted against, app.cost-cap-per-item-usd below. Defaults to 0 (verification effectively
    # never affordable) so simply flipping `enabled` above to true never silently exhausts a job's
    # always-on AI budget for every other tier — must be set to a real value alongside `enabled`.
    cost-cap-per-item-usd: ${HIGH_CONFIDENCE_VERIFICATION_COST_CAP_PER_ITEM_USD:0}
  # Per-job AI-spend cap per item (see JobCostBudgetService#costCapPerItemUsd) — $5/1,000 items by
  # default. Only override for a throwaway diagnostic job deliberately made of AI-eligible items.
  cost-cap-per-item-usd: ${APP_COST_CAP_PER_ITEM_USD:0.005}
  # Size of AsyncConfig#itemProcessingExecutor (per-item parallelism within a single job). 8 by
  # default, unchanged from the previous hardcoded value — externalized (item 167, 2026-09-01) so a
  # closed-mode deployment can raise it later once the registry-fan-out oversubscription rationale
  # for "8" no longer applies (see that bean's javadoc and docs/spec/closed-mode-plan.md §7 P4).
  # Keep spring.datasource.hikari.maximum-pool-size comfortably above this value plus any
  # concurrently-running sync workers and the web layer's own connection needs.
  item-processing-pool-size: ${ITEM_PROCESSING_POOL_SIZE:8}
  # Weekly automatic sync of the 9 registry mirrors from every package name this app has ever
  # resolved via a live registry lookup — closed-mode backlog item 183,
  # RegistryMirrorSyncService/RegistryMirrorScheduledSync. This is the WRITE path: it makes live
  # outbound HTTP calls to each ecosystem's registry to populate registry_package_mirror. It is
  # independent of the closed-mode.*-mirror-enabled flags above, which are the separate READ path
  # (whether Tier1 lookups consult the mirror table instead of a live call) — neither flag group
  # gates the other. Turning this sync on still reaches out to every registry over the network
  # even if all 9 closed-mode.*-mirror-enabled flags are false, and turning all 9 of those off
  # does not disable or pause this sync. Off by default, same safety-first convention as the CPE
  # weekly resync flags above; can also be triggered manually via /admin/registry-mirror.
  registry-mirror-scheduled-sync-enabled: ${REGISTRY_MIRROR_SCHEDULED_SYNC_ENABLED:false}
  # Sunday 02:00 UTC by default — see RegistryMirrorScheduledSync#resyncWeekly's javadoc for why
  # this slot was chosen relative to the other weekly/daily sync jobs.
  registry-mirror-scheduled-sync-cron: ${REGISTRY_MIRROR_SCHEDULED_SYNC_CRON:0 0 2 * * SUN}
  # How many package names RegistryMirrorSyncService hands to each ecosystem's
  # *MirrorSyncService#syncPackages/#syncModules per call — bounds memory and gives incremental
  # progress in the logs for a large observed-name seed list. See that class's own javadoc. Must be
  # a positive (>= 1) value — 0 or negative falls back to RegistryMirrorSyncService's own
  # DEFAULT_CHUNK_SIZE (200), logging a warning, rather than hanging/throwing (PR #122 REVISE).
  registry-mirror-sync-chunk-size: ${REGISTRY_MIRROR_SYNC_CHUNK_SIZE:200}
  # How many days a seed name's registry_package_mirror.last_synced_at can be old and still be
  # skipped by RegistryMirrorSyncService (closed-mode backlog item 186) instead of being re-synced
  # this run — bounds cost so a weekly full sync doesn't unconditionally re-fetch every observed
  # name every week. See RegistryMirrorSyncService#freshnessDays' own javadoc. 0 or negative
  # disables the filter entirely (every observed name is always re-synced); a name never synced
  # before is never excluded by this, regardless of the value set here.
  registry-mirror-sync-freshness-days: ${REGISTRY_MIRROR_SYNC_FRESHNESS_DAYS:7}
  # NVD CVE API bulk mirror (closed-mode backlog item 202, docs/spec/closed-mode-plan.md §4-2):
  # nvd_cve_records/nvd_cve_cpe_match, populated by NvdCveSyncService via
  # NvdCveBackfillScheduledRunner (daily, self-terminating once baseline_completed) or the manual
  # /admin/nvd-cve kick. Off by default -- required, not optional: the estimated ~2-3GB storage
  # impact (§4-2-6) is on top of this app's existing 15GB DB size hard cap, so growing this mirror
  # must be a deliberate per-environment opt-in, same convention as every other *-mirror-enabled/
  # *-scheduled-resync-enabled flag above.
  nvd-cve-backfill:
    enabled: ${NVD_CVE_BACKFILL_ENABLED:false}
    # 06:00 UTC daily by default -- see NvdCveBackfillScheduledRunner#runBackfillTick's javadoc for
    # why this slot was chosen relative to every other sync job (in particular, why it must not
    # collide with the CPE dictionary's Sunday 01:30 UTC weekly resync -- both share the same
    # process-wide NvdRateLimiter).
    cron: ${NVD_CVE_BACKFILL_CRON:0 0 6 * * *}
    # Per-run budget, counted in fetch *attempts* (not successes -- see NvdCveSyncService's class
    # javadoc for why) so a chunk stuck retrying a persistent error can't consume unlimited
    # wall-clock time within one run. At these defaults, a full ~245-300 request backfill
    # (docs/spec/closed-mode-plan.md §4-2-3) finishes in roughly 4-5 daily runs.
    max-requests-per-run: ${NVD_CVE_BACKFILL_MAX_REQUESTS_PER_RUN:60}
    max-duration-minutes: ${NVD_CVE_BACKFILL_MAX_DURATION_MINUTES:60}

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Secure attribute on the session cookie (JSESSIONID) — restricts it to HTTPS-only
        # transport. Off by default: the current docker-compose setup has no TLS termination, so
        # local dev and any HTTP-only environment would lose the ability to log in (a Secure cookie
        # is never sent back by the browser over plain HTTP) if this defaulted to true. MUST be set
        # to true via SESSION_COOKIE_SECURE once the deployment sits behind TLS (see
        # docs/spec/ec2-deployment-guide.md) — otherwise the session cookie can leak in plaintext.
        secure: ${SESSION_COOKIE_SECURE:false}
        # Already Spring Boot/Tomcat's default even when unset (true) — pinned explicitly here so
        # this block documents the full, intentional cookie-hardening posture (Secure + HttpOnly)
        # in one place instead of leaving HttpOnly's protection implicit.
        http-only: true

logging:
  level:
    org.springframework.security: INFO
  # Writes to console AND this file (Spring Boot's default logback config adds a FILE appender
  # automatically once logging.file.name is set — no custom logback.xml needed). The directory is
  # bind-mounted to the host via docker-compose.yml so log files survive container
  # restarts/recreates and are readable directly from the host filesystem, not just via
  # `docker compose logs`. Override via LOG_FILE for non-compose environments.
  file:
    name: ${LOG_FILE:/var/log/app/backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
