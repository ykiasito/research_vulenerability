spring:
  application:
    name: vulncheck-server

  # Hardcoded on purpose (no ${SPRING_DATASOURCE_URL:...} env fallback): this file exists
  # specifically so that `mvn test` can never silently fall back to (or be pointed at) the real
  # dev database. Tests must always run against the dedicated vulncheck_test database.
  datasource:
    url: jdbc:postgresql://postgres:5432/vulncheck_test
    # Dedicated non-superuser role, scoped to only the vulncheck_test database/public schema
    # (2026-08-29) — separate from the production `vulncheck` superuser role so a test run can never
    # touch anything outside its own sandboxed database, even by accident.
    username: vulncheck_test
    password: vulncheck_test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Ignore repeatable migrations that were applied by a branch we're not currently on (e.g.
    # closed-mode's R__closed_mode_strip.sql, item 262) but are missing locally. Without this,
    # `validateOnMigrate` (default true) fails ApplicationContext startup with "Detected applied
    # migration not resolved locally" once the shared vulncheck_test DB's flyway_schema_history
    # has recorded that repeatable migration from a different branch's test run (item 285, 2026-09-04).
    #
    # "*:future" is Flyway's own built-in default for this property (FlywayModel.defaults()), but
    # Spring Boot's FlywayAutoConfiguration applies spring.flyway.ignore-migration-patterns by
    # *replacing* Flyway's default array rather than merging into it. Setting only
    # "repeatable:missing" here (as an earlier revision of this file did) silently drops "*:future"
    # and reintroduces item 285's failure mode in the opposite direction: closed-mode trails master
    # by design (closedModeOnlyMigrationSetMatchesBaseline keeps it from adding its own versioned
    # migrations), so when master adds a new versioned migration (e.g. V42) and applies it to the
    # shared vulncheck_test DB, a subsequent `mvn test` on closed-mode would see that migration as
    # FUTURE_SUCCESS (applied but newer than anything resolved locally) and fail ApplicationContext
    # startup — exactly the item 285 symptom, just triggered from the other branch/direction. Both
    # patterns must stay listed so both directions keep working:
    #   - "*:future": unchanged from Flyway's own default — a locally-unresolved but *newer*
    #     applied migration (closed-mode running behind master) is tolerated, same as before this
    #     property was ever set.
    #   - "repeatable:missing": item 285's original fix — a locally-unresolved repeatable migration
    #     from a branch we're not on (e.g. master running without closed-mode's repeatable strip
    #     migration) is tolerated.
    # Neither pattern relaxes detection of a genuinely *missing* versioned migration (a gap in the
    # locally-resolved version sequence below the applied baseline) — that failure mode is
    # unaffected and still fails validation as before.
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  # Test-only key, not the retired production default (SecretEncryptionService now fail-fasts on
  # that hash) and not used anywhere outside `mvn test` against vulncheck_test. This repository is
  # public, so this literal is public knowledge by definition — never reuse it (or generate a fresh
  # one and reuse that) outside of tests, and never point this key at any real/production database.
  secret-encryption-key: 6tdyAv3iE6mznN5rAvyzoSPSfZ2No6Y1Tq4hlubAB0s=
  admin-email: ""
  job-retention-days: 30
  cpe-full-sync-on-startup: false
  cpe-scheduled-resync-enabled: false
  cpe-scheduled-resync-cron: "0 30 1 * * SUN"

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
